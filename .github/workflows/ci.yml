name: CI

# Pull requests, pushes to main and reuse from release.yml (workflow_call). Single required check
# for branch protection: "CI OK".
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      version-suffix:
        description: Prerelease label appended to every package version (for example rc.1). Empty packs the versions declared in the csproj files.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # NOTE: NOT warnings-as-errors (unlike the Vali-Mediator template this was adapted from) — this
    # repo currently has ~300 pre-existing nullable/analyzer warnings, mostly in test files, that
    # were never audited. Flipping that on would block every future PR until that backlog is
    # cleaned up, which is a separate effort from "stand up a CI gate". Revisit once the backlog
    # is addressed.
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore Vali-Flow.Core.sln

      - name: Build
        run: dotnet build Vali-Flow.Core.sln -c Release --no-restore

  test:
    name: test / ${{ matrix.os }} / ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tfm: [net8.0, net9.0]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # Full environment trace first: installed SDKs/runtimes and OS, to compare Linux and Windows runs.
      - name: Environment
        shell: bash
        run: |
          mkdir -p logs
          {
            echo "### ${{ matrix.os }} / ${{ matrix.tfm }}"
            uname -a || true
            dotnet --info
          } 2>&1 | tee logs/00-environment.log

      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          dotnet restore Vali-Flow.Core.sln 2>&1 | tee logs/01-restore.log

      - name: Build
        shell: bash
        # minimal keeps the text log small enough to share; the .binlog uploaded with the trace has the full build detail.
        run: |
          set -o pipefail
          dotnet build Vali-Flow.Core.sln -c Release --no-restore -v:minimal -bl:logs/build.binlog 2>&1 | tee logs/02-build.log

      # Every project runs even if an earlier one fails, so the trace always holds the complete result of the cell.
      # Vali-Flow.Core.Tests multi-targets net8.0;net9.0 and runs on both cells. Analyzers.Tests and
      # Generator.Tests each have a single <TargetFramework>net9.0</TargetFramework> (no net8.0 build
      # output exists for them at all) — skip them on the net8.0 cell instead of letting `dotnet test`
      # fail outright on a framework they were never built for.
      - name: Unit tests with coverage on ${{ matrix.tfm }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          projects="Vali-Flow.Core.Tests"
          if [ "${{ matrix.tfm }}" = "net9.0" ]; then
            projects="$projects Vali-Flow.Core.Analyzers.Tests Vali-Flow.Core.Generator.Tests"
          fi
          for project in $projects; do
            echo "::group::$project on ${{ matrix.tfm }}"
            dotnet test "$project" -c Release --no-build -f "${{ matrix.tfm }}" \
              --logger "console;verbosity=detailed" \
              --logger "trx;LogFileName=$project-${{ matrix.tfm }}.trx" \
              --collect:"XPlat Code Coverage" --results-directory "TestResults/${{ matrix.tfm }}/$project" \
              2>&1 | tee "logs/03-test-$project.log" || status=1
            echo "::endgroup::"
          done
          exit $status

      # Totals per project straight from the .trx files, shown on the run summary page.
      - name: Test totals
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          rows = ["| Project | Total | Passed | Failed | Skipped |", "|---|---:|---:|---:|---:|"]
          for path in sorted(glob.glob("TestResults/**/*.trx", recursive=True)):
              counters = ET.parse(path).getroot().find(".//{*}Counters")
              if counters is None:
                  continue
              name = os.path.basename(path)[:-4]
              failed = int(counters.get("failed", 0))
              skipped = int(counters.get("total", 0)) - int(counters.get("executed", 0))
              rows.append(f"| {name} | {counters.get('total')} | {counters.get('passed')} | {failed}{' (!)' if failed else ''} | {skipped} |")
          report = "### Tests ${{ matrix.os }} / ${{ matrix.tfm }}\n\n" + "\n".join(rows) + "\n"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(report + "\n")
          PY

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.tfm }}
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

      # Complete trace of this cell: console logs, binlog and .trx results. Uploaded even when tests fail.
      - name: Upload full trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-${{ matrix.os }}-${{ matrix.tfm }}
          path: |
            logs/**
            TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  # One downloadable text file with the whole trace of the 4 cells (Linux and Windows x net8.0/net9.0).
  trace:
    name: Full trace (single file)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: trace-*
          path: trace

      - name: Merge every log into one file
        shell: bash
        run: |
          out=full-trace.txt
          : > "$out"
          while IFS= read -r f; do
            rel="${f#trace/}"
            {
              echo
              echo "=================================================================="
              echo "== ${rel%%/*} :: ${rel#*/}"
              echo "=================================================================="
              cat "$f"
            } >> "$out"
          done < <(find trace -name '*.log' | sort)
          wc -l "$out"
          {
            echo "### Full trace"
            echo
            echo "Download the **full-trace** artifact of this run: one text file with the environment, restore, build and"
            echo "detailed test output of every OS x target framework cell."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the single-file trace
        uses: actions/upload-artifact@v4
        with:
          name: full-trace
          path: full-trace.txt
          if-no-files-found: error
          retention-days: 14

  coverage:
    # NOTE: 90% is a starting gate, not an audited baseline — this repo had no prior coverage
    # measurement wired into CI. Adjust after the first green run shows the real per-library %.
    name: Coverage gate (>= 90% per library)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: Merge reports and enforce the gate
        env:
          THRESHOLD: '90'
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          LIBS = ["Vali-Flow.Core", "Vali-Flow.Core.Analyzers", "Vali-Flow.Core.Generator"]
          THRESHOLD = float(os.environ["THRESHOLD"])
          OSES = ["ubuntu-latest", "windows-latest"]
          TFMS = ["net8.0", "net9.0"]

          missing = [
              f"coverage-{os_name}-{tfm}"
              for os_name in OSES
              for tfm in TFMS
              if not glob.glob(f"coverage/coverage-{os_name}-{tfm}/**/coverage.cobertura.xml", recursive=True)
          ]

          # Cobertura paths are relative to a per-report <source> that differs by OS and project, so a file is keyed by its
          # last two path segments (folder/name.cs). Lines are unioned across every OS/TFM report: a line counts as covered
          # when any run hit it.
          lines = {lib: {} for lib in LIBS}
          reports = glob.glob("coverage/**/coverage.cobertura.xml", recursive=True)
          for path in reports:
              for package in ET.parse(path).getroot().iter("package"):
                  store = lines.get(package.get("name"))
                  if store is None:
                      continue
                  for cls in package.iter("class"):
                      parts = cls.get("filename").replace("\\", "/").split("/")
                      file_key = "/".join(parts[-2:])
                      for line in cls.iter("line"):
                          key = (file_key, int(line.get("number")))
                          store[key] = max(store.get(key, 0), int(line.get("hits")))

          rows = ["| Library | Lines | Covered | Line coverage | Gate |", "|---|---:|---:|---:|:---:|"]
          failed = []
          for lib in LIBS:
              total = len(lines[lib])
              covered = sum(1 for hits in lines[lib].values() if hits > 0)
              pct = 100.0 * covered / total if total else 0.0
              ok = total > 0 and pct >= THRESHOLD
              if not ok:
                  failed.append(lib)
              rows.append(f"| {lib} | {total} | {covered} | {pct:.1f}% | {'pass' if ok else 'FAIL'} |")

          cells = ", ".join(f"{o} / {t}" for o in OSES for t in TFMS)
          report = (f"### Unit-test line coverage (gate >= {THRESHOLD:g}%, {len(reports)} reports merged)\n\n"
                    + "\n".join(rows)
                    + f"\n\nExpected cells: {cells}\n"
                    + (f"\nMissing reports: {', '.join(missing)}\n" if missing else "\nAll 4 OS x TFM reports present.\n"))
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(report + "\n")
          if missing:
              sys.exit("Coverage gate failed: missing reports for " + ", ".join(missing))
          if failed:
              sys.exit("Coverage gate failed for: " + ", ".join(failed))
          PY

  pack:
    name: Pack NuGet packages
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION_SUFFIX: ${{ inputs.version-suffix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Apply the prerelease label
        if: ${{ inputs.version-suffix != '' }}
        run: |
          if ! [[ "$VERSION_SUFFIX" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "::error::version-suffix may only contain letters, digits, dots and hyphens"
            exit 1
          fi
          # Vali-Flow.Core.Analyzers/Generator pin their own Version (1.x) independently of the
          # core's (2.x); the label is appended per project via this shared MSBuild import.
          cat > Directory.Build.targets <<'XML'
          <Project>
            <PropertyGroup Condition="'$(PrereleaseLabel)' != ''">
              <Version>$(Version)-$(PrereleaseLabel)</Version>
            </PropertyGroup>
          </Project>
          XML

      - name: Pack the core first, then the Roslyn companion packages
        run: |
          for project in Vali-Flow.Core Vali-Flow.Core.Analyzers Vali-Flow.Core.Generator; do
            dotnet pack "$project/$project.csproj" -c Release -o artifacts ${VERSION_SUFFIX:+-p:PrereleaseLabel="$VERSION_SUFFIX"}
          done

      - name: Verify package contents
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          import zipfile

          PACKAGES = {"Vali-Flow.Core", "Vali-Flow.Core.Analyzers", "Vali-Flow.Core.Generator"}
          TFMS = {"net8.0", "net9.0"}

          errors = []
          found = {}
          for path in sorted(glob.glob("artifacts/*.nupkg")):
              with zipfile.ZipFile(path) as archive:
                  names = archive.namelist()
                  root = ET.fromstring(archive.read(next(n for n in names if n.endswith(".nuspec"))))
              ns = {"n": root.tag.split("}")[0].strip("{")}
              pid = root.find("n:metadata/n:id", ns).text
              version = root.find("n:metadata/n:version", ns).text
              # Analyzers/Generator ship under analyzers/dotnet/cs, not lib/ (Roslyn component packaging).
              libs = {n.split("/")[1] for n in names if n.startswith("lib/") and n.endswith(".dll")}
              found[pid] = (version, libs)

          for pid in sorted(PACKAGES - set(found)):
              errors.append(f"{pid}: package missing from artifacts/")
          core_version, core_libs = found.get("Vali-Flow.Core", (None, set()))
          if core_libs != TFMS:
              errors.append(f"Vali-Flow.Core {core_version}: lib/ has {sorted(core_libs)}, expected {sorted(TFMS)}")

          for pid, (version, libs) in sorted(found.items()):
              print(f"{pid} {version}: lib {sorted(libs) or '(analyzers/dotnet/cs)'}")
          if errors:
              sys.exit("Package check failed:\n  " + "\n  ".join(errors))
          print("Package check passed.")
          PY

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  ci-ok:
    name: CI OK
    if: always()
    needs: [build, test, coverage, pack]
    runs-on: ubuntu-latest
    steps:
      - name: Every job must have succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled|skipped)"'; then
            exit 1
          fi
